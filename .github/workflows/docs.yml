name: Docs

on:
  pull_request:
  workflow_dispatch:

jobs:
  sphinx-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build docs with warnings as errors
        run: |
          sphinx-build -b html -W --keep-going -c docs docs /tmp/brainana_docs
