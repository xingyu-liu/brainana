name: Docs

on:
  pull_request:
  workflow_dispatch:

jobs:
  sphinx-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          # Docs-only install (matches .readthedocs.yaml): Sphinx stack + package
          # metadata without torch/SimpleITK/fireants. pip cannot resolve the
          # fireants==1.5.0 / SimpleITK>=2.3.0 pin conflict (uv override is local-only).
          #
          # NOTE: --no-deps is deliberate, but it means this workflow can never
          # detect a missing or wrong dependency -- it does not resolve the
          # dependency set at all. Do not "fix" it. The dependency guard is
          # .github/workflows/deps.yml, which installs for real.
          pip install "sphinx>=7.0" "myst-parser>=2.0" "sphinx-rtd-theme>=2.0" "sphinx-copybutton>=0.5.0" "sphinxcontrib-mermaid>=0.9" "sphinxext-opengraph>=0.9"
          pip install --no-deps -e .

      - name: Build docs with warnings as errors
        run: |
          sphinx-build -b html -W --keep-going -c docs docs /tmp/brainana_docs
